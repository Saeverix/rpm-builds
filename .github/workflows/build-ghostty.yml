# Builds ghostty. Single package, single distro -- the simplest of the four
# workflows structurally, though %build/%install are the most involved spec in
# this repo. See packages/ghostty/ghostty.spec and the README's ghostty section
# for why: Fedora 44's default zig resolves to 0.16.0 but Ghostty v1.3.1 pins
# minimum_zig_version 0.15.2, so a pinned upstream Zig release tarball is
# vendored as a build-time-only tool, and build.zig.zon's dependencies are
# pre-fetched into an offline cache before rpmbuild runs at all.
name: build ghostty

on:
  push:
    tags:
      - 'ghostty-*'
  pull_request:
    paths:
      - 'packages/ghostty/**'
      - '.github/workflows/build-ghostty.yml'
  workflow_dispatch:

# Least privilege by default. The release job below raises this for itself only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build -- it publishes. Superseded PR builds are fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous: this compiles GTK4/libadwaita plus Ghostty's own Zig dependency
    # tree (libxev, vaxis, highway, glslang and friends) with no incremental
    # cache between runs.
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: prepare build environment
        run: |
          set -eux
          # dnf5-plugins provides `dnf builddep`, rpmdevtools provides `spectool`.
          # git-core IS required here -- build.zig.zon.txt lists one dependency as
          # git+https://github.com/jacobsandlund/uucode#<commit>, and the zig
          # dependency fetch below shells out to `zig fetch` on it, which needs
          # git on PATH. This is a build-time-only need: the fetch happens once in
          # this job and gets baked into Source3, so rpmbuild itself never touches
          # git -- `zig build --system` disables all fetching, including that one.
          dnf -y install rpm-build rpmdevtools dnf5-plugins git-core
          mkdir -p _build/SOURCES _build/BUILD _build/BUILDROOT _build/RPMS _build/SRPMS output

          # Prove `builder` can traverse to the workspace before the build depends on
          # it -- created here, but not chowned to yet. Unlike mangowm and noctalia,
          # the root-owned Zig fetch below has to land in _build/SOURCES before the
          # chown, so the single chown -R happens later, right before rpmbuild.
          id builder >/dev/null 2>&1 || useradd -m builder
          runuser -u builder -- ls -ld "$PWD/_build"

      # Not a stub: rpmspec expands %{?dist} on the running distro, so this asserts
      # the container is the distro we think it is, that the spec still parses
      # there, and that the filenames the release job will upload are the expected
      # ones.
      - name: dry run
        run: |
          set -eu
          spec=packages/ghostty/ghostty.spec
          echo "  srpm:    $(rpmspec -q --srpm --qf '%{name}-%{version}-%{release}' "$spec")"
          echo '  would publish:'
          rpmspec -q --qf '    %{name}-%{version}-%{release}.%{arch}.rpm\n' "$spec" \
            | grep -vE -- '-debug(info|source)-'

      - name: build
        run: |
          set -eux
          # Fetches Source0 (release tarball), Source1 (its .minisig) and Source2
          # (the vendored Zig toolchain), all of which have URLs. Source3 (the Zig
          # dependency cache) has a bare filename, so spectool skips it -- it is
          # built by the rest of this step instead, the same way fish's vendored
          # cargo crates are built in build-fish.yml.
          spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/ghostty/ghostty.spec

          # Unpack the vendored Zig 0.15.2 and the Ghostty release tarball into
          # scratch directories, then run upstream's own fetch-zig-cache.sh to
          # populate an offline dependency cache. This is the only step in this
          # whole workflow that touches the network on Ghostty's behalf.
          SOURCES=$PWD/_build/SOURCES
          VER=$(rpmspec -q --qf '%{version}\n' --srpm packages/ghostty/ghostty.spec)
          SRC=$SOURCES/ghostty-$VER
          ZIGDIR=$SOURCES/zig-x86_64-linux-0.15.2
          CACHE=$SOURCES/zig-cache-tmp
          rm -rf "$SRC" "$ZIGDIR" "$CACHE"
          tar -C "$SOURCES" -xf "$SOURCES/ghostty-$VER.tar.gz"
          tar -C "$SOURCES" -xf "$SOURCES/zig-x86_64-linux-0.15.2.tar.xz"
          export PATH="$ZIGDIR:$PATH"
          ZIG_GLOBAL_CACHE_DIR="$CACHE" "$SRC/nix/build-support/fetch-zig-cache.sh"

          # Source3 is just the "p" subdirectory zig fetch populates -- that is
          # also the path %install's `--system` flag points at once this is
          # unpacked there again.
          tar -C "$CACHE" -cJf "$SOURCES/ghostty-$VER-zig-cache.tar.xz" p
          rm -rf "$SRC" "$ZIGDIR" "$CACHE"

          dnf -y builddep packages/ghostty/ghostty.spec

          # THE RULE, the same in every workflow here: root does dnf (and, for this
          # package only, the Zig cache fetch above), everything else runs as
          # `builder`. The chown happens here rather than in "prepare build
          # environment" because the fetch above has to write into _build/SOURCES
          # as root first -- this re-owns the whole tree to builder right before
          # the one thing that actually must not run as root.
          chown -R builder:builder _build
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/ghostty/ghostty.spec

          # The whole claim of the chown above, in one command. If a future edit
          # writes into _build as root after this point, this fails here rather
          # than silently producing a package built with the wrong privileges.
          if [ -n "$(find _build ! -user builder -print -quit)" ]; then
            echo 'ERROR: root-owned files in _build; something ran privileged' >&2
            find _build ! -user builder -ls | head >&2
            exit 1
          fi

          cp _build/RPMS/*/*.rpm _build/SRPMS/*.rpm output/
          sha256sum output/*.rpm

      # Signed here rather than at publish time so the Release asset is byte for
      # byte what dnf serves -- otherwise anyone grabbing an RPM off the Releases
      # page gets an unsigned file that gpgcheck=1 refuses.
      #
      # No `set -x` in this step: it would echo the key material into the log.
      - name: sign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
        run: |
          set -eu
          dnf -y install rpm-sign gnupg2

          # rpmsign shells out to gpg, so the key has to be in a keyring rather than
          # just on disk. The key carries no passphrase, which is what lets gpg run
          # with rpm's default --pinentry-mode cancel.
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')
          [ -n "$FPR" ] || { echo 'RPM_GPG_KEY imported no secret key' >&2; exit 1; }

          # Binary RPMs only. debuginfo, debugsource and the SRPM are all
          # rebuildable from the tagged spec, so they stay out of the repo.
          mkdir -p publish
          cp $(ls output/*.rpm | grep -vE -- '-debug(info|source)-|\.src\.rpm$') publish/
          rpmsign --define "_gpg_name $FPR" --addsign publish/*.rpm

          # Verify against the key that just made the signatures. Do NOT test this
          # by checking that a signature tag is populated: %{SIGPGP} is the legacy
          # tag and reads (none) on rpm 4.20 even for a correctly signed package, so
          # that check rejects every build. Importing the public key and letting rpm
          # verify is the honest test, and -v records the key ID in the log.
          gpg --export --armor "$FPR" > /tmp/rpm-pubkey.asc
          rpm --import /tmp/rpm-pubkey.asc
          if ! rpm -Kv publish/*.rpm; then echo 'signature verification failed'; exit 1; fi

      - name: upload build output
        uses: actions/upload-artifact@v7
        with:
          name: rpms-fedora-44
          path: output/*.rpm
          if-no-files-found: error

      - name: upload publishable rpms
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: publish-fedora-44
          path: publish/*.rpm
          if-no-files-found: error

  # Separate job on the host runner: `gh` is preinstalled there and is not
  # packaged for every distro built in above.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download publishable rpms
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          merge-multiple: true
          path: publish

      # --verify-tag refuses to invent a release for a tag that does not exist.
      # create-or-upload because a re-run of the same tag must not fail outright.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout, so there is no git remote for gh to
          # infer the repository from and it exits with "not a git repository".
          # GH_REPO names the target directly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Built from \`$GITHUB_REF_NAME\`." publish/*.rpm \
            || gh release upload "$GITHUB_REF_NAME" --clobber publish/*.rpm

  # Regenerating the dnf repo is a direct call rather than a `release: published`
  # trigger, because the release above was created with the default GITHUB_TOKEN and
  # those events deliberately do not start other workflows. See publish-pages.yml.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-pages.yml
    permissions:
      contents: read     # gh release download
      pages: write
      id-token: write    # deploy-pages authenticates over OIDC
    # Passes RPM_GPG_KEY through; the metadata is signed with the same key as the RPMs.
    secrets: inherit

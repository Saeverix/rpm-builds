# Builds the dnf repo and deploys it to GitHub Pages.
#
# THE DESIGN, in one sentence: the published repo is a pure function of the set of
# GitHub Releases. This workflow does not mutate a live tree -- it downloads every
# release's RPMs, builds the metadata from scratch, and replaces the whole site. So:
#
#   - Adding a package is publishing a release. Removing one is deleting a release and
#     re-running this workflow; there is no separate delete path.
#   - The metadata can never be half-updated, which is what the K3s pipeline could do
#     when one matrix axis published and the other failed.
#   - repomd.xml is signed in the same job that generates it, so the whole
#     pull-it-back-over-ssh-and-sign dance in .woodpecker/*.yaml disappears -- and with
#     it the `ssh -n` stdin footgun that once silently skipped signing and left clients
#     without repomd.xml.asc.
#
# A tag prefixed `citest-` is therefore harmless here: the tag name never reaches the
# repo, only the NVR inside the RPM does. Nothing filters on tag names.
name: publish pages

on:
  # How CI actually reaches this workflow: each build-*.yml calls it directly after
  # its release job.
  #
  # It is NOT triggered by `release: published`, and that is not an oversight. A
  # release created by `gh release create` with the default GITHUB_TOKEN does not emit
  # events that start other workflows -- GitHub blocks that to prevent workflows
  # recursing. So a release-triggered version of this workflow silently never runs.
  # (The same rule is why a Renovate PR needs a PAT or App token to get built.)
  #
  # workflow_call also sidesteps two constraints that would bite on a branch:
  # `workflow_run` and `workflow_dispatch` only work for workflow files that exist on
  # the default branch, so neither is usable until this merges to main.
  workflow_call:

  # Kept for releases created BY HAND through the web UI, which do emit the event
  # because a person's token made them. Harmless alongside workflow_call today; if a
  # PAT is ever used for `gh release create`, this would start firing too and want
  # removing to avoid a double publish.
  release:
    types: [published]

  # Regenerate the metadata without a new package -- after deleting a release, or to
  # pick up a change to repo/*.repo or repo/index.html. Only available once this file
  # is on the default branch.
  workflow_dispatch:

permissions:
  contents: read      # gh release list / download
  pages: write
  id-token: write     # deploy-pages authenticates over OIDC

concurrency:
  group: pages
  # Deliberately NOT cancel-in-progress. Two package tags landing close together must
  # serialize: cancelling the first would leave the second deploying a site built from
  # a partial download, silently dropping packages.
  cancel-in-progress: false

jobs:
  # Distro tooling, so this runs in the Fedora container. Everything it needs is
  # packaged there: gh, createrepo_c, rpm-sign, gnupg2, and dnf5-plugins for
  # `dnf repomanage`.
  build-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      # Only for repo/ -- the RPMs come from the Releases, not the checkout.
      - uses: actions/checkout@v7

      - name: install tooling
        run: |
          set -eux
          dnf -y install gh createrepo_c rpm-sign gnupg2 dnf5-plugins

      - name: download every release's rpms
        env:
          GH_TOKEN: ${{ github.token }}
          # Required even though this job DOES check out. actions/checkout falls back
          # to the REST tarball API in a container with no git binary, so there is no
          # .git directory and gh cannot infer the repository from a remote -- it
          # exits with "not a git repository". GH_REPO names the target directly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          mkdir -p incoming
          # --exclude-drafts: a draft release is not published and must not reach
          # clients. Prereleases ARE included -- noctalia ships betas and they are
          # meant to be installable.
          gh release list --limit 200 --exclude-drafts --json tagName -q '.[].tagName' > tags.txt
          wc -l < tags.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            # A release with no .rpm assets is not an error -- a tag could have been
            # made before its build finished, or its assets deleted by hand.
            gh release download "$tag" -D incoming -p '*.rpm' --clobber || \
              echo "note: no rpm assets on $tag"
          done < tags.txt
          echo "downloaded $(find incoming -name '*.rpm' | wc -l) rpms from $(wc -l < tags.txt) releases"

      - name: sort into per-distro trees
        run: |
          set -eux
          mkdir -p site/fedora/44/x86_64 site/almalinux/10/x86_64
          # The dist tag in the filename is what decides the tree -- the assets are
          # self-describing (glaze-devel-7.2.0-1.fc44.noarch.rpm), so no manifest is
          # needed. An RPM is never shared between distros: EL10 is glibc 2.39 against
          # Fedora 44's 2.43 and the sonames differ.
          #
          # The debuginfo/debugsource/src filter is belt and braces: the build
          # workflows already exclude them before uploading. Cheap insurance against a
          # release created by hand.
          for f in incoming/*.rpm; do
            # No RPMs at all is legitimate, not an error: it is what you get after
            # deleting every release and re-running to clear the repo. Without this
            # the unexpanded glob falls through to the catch-all below and fails the
            # workflow with "cannot place incoming/*.rpm".
            [ -e "$f" ] || continue
            case "$f" in *-debuginfo-*|*-debugsource-*|*.src.rpm) continue ;; esac
            case "$f" in
              *.fc44.*) cp "$f" site/fedora/44/x86_64/ ;;
              *.el10.*) cp "$f" site/almalinux/10/x86_64/ ;;
              *) echo "ERROR: cannot place $f -- unrecognised dist tag" >&2; exit 1 ;;
            esac
          done
          find site -name '*.rpm' | sort

      - name: prune to the newest three of each package
        run: |
          set -eux
          # repomanage reads RPM headers, so it is version-aware rather than lexical --
          # fish-4.10.0 correctly outranks fish-4.9.0. It works on a bare directory with
          # no metadata, which is always the case here because every run starts empty.
          for dir in site/fedora/44/x86_64 site/almalinux/10/x86_64; do
            [ -n "$(ls -A "$dir")" ] || continue
            dnf repomanage --old --keep 3 "$dir" | xargs -r rm -fv
          done

      - name: generate metadata
        run: |
          set -eux
          # Full run, not --update: there is nothing to update, the tree was just built.
          createrepo_c site/fedora/44/x86_64

          # --general-compress-type=gz for the EL10 tree. Fedora 44's createrepo_c may
          # default to zstd, and whether EL10's dnf 4.20 reads that has NOT been
          # verified. gz is universally understood, and the metadata is small enough
          # that the compression ratio is irrelevant. Revisit when fish's EL10 axis is
          # enabled and this tree is actually non-empty.
          createrepo_c --general-compress-type=gz site/almalinux/10/x86_64

      # repomd.xml is signed in the same job that wrote it -- the whole reason the K3s
      # pipeline needed to pull it back over ssh was that createrepo_c ran somewhere the
      # key was not.
      #
      # No `set -x` in this step: it would echo the key material into the log.
      - name: sign the metadata
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
        run: |
          set -eu
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')
          [ -n "$FPR" ] || { echo 'RPM_GPG_KEY imported no secret key' >&2; exit 1; }

          for dir in site/fedora/44/x86_64 site/almalinux/10/x86_64; do
            [ -f "$dir/repodata/repomd.xml" ] || continue
            gpg --batch --yes --detach-sign --armor -u "$FPR" \
              -o "$dir/repodata/repomd.xml.asc" "$dir/repodata/repomd.xml"
            # repo_gpgcheck=1 clients cannot load the repo at all without this file, so
            # assert it landed rather than trusting the exit status above.
            test -s "$dir/repodata/repomd.xml.asc"
          done

          gpg --export --armor "$FPR" > site/RPM-GPG-KEY-saeverix

          # The key that signs the metadata must be the key clients are told to trust.
          # If repo/RPM-GPG-KEY-saeverix ever drifts from the signing secret, every
          # client fails `dnf makecache` with an unhelpful error -- catch it here.
          if ! diff -q site/RPM-GPG-KEY-saeverix repo/RPM-GPG-KEY-saeverix >/dev/null; then
            echo 'ERROR: RPM_GPG_KEY does not match repo/RPM-GPG-KEY-saeverix' >&2
            gpg --show-keys --with-colons repo/RPM-GPG-KEY-saeverix | awk -F: '/^fpr/{print "  committed: " $10}' >&2
            echo "  signing:   $FPR" >&2
            exit 1
          fi

      - name: add the client-facing files
        run: |
          set -eux
          cp repo/saeverix.repo repo/saeverix-almalinux.repo repo/index.html site/
          # The public key is already in site/, exported from the signing key above and
          # diffed against the committed copy, so it is deliberately not copied here.
          find site -maxdepth 1 -type f | sort

      - name: guard the pages size limit
        run: |
          set -eu
          # Pages publishes at most 1 GB. --keep 3 above bounds this at roughly
          # 150-250 MB, so 800 is a warning shot rather than a real ceiling: if it
          # trips, the retention policy needs revisiting, not this number.
          mb=$(du -sm site | cut -f1)
          echo "site is ${mb} MB"
          if [ "$mb" -gt 800 ]; then
            echo "ERROR: site is ${mb} MB, over the 800 MB guard (Pages allows 1 GB)" >&2
            du -sm site/*/*/* | sort -rn | head >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: repo-tree
          path: site
          if-no-files-found: error
          # Only an intermediate handoff to the deploy job below; the durable copies are
          # the Releases.
          retention-days: 1

  # Split from build-repo on purpose, the same way the release job in build-mangowm.yml
  # is: GitHub-facing tooling runs on the host, distro tooling in the container.
  # upload-pages-artifact shells out to `tar --dereference --hard-dereference` and cares
  # about ownership in the archive, and the tree it would be archiving was written by a
  # container running as root. Not worth making the first deploy depend on that.
  deploy:
    needs: build-repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo-tree
          path: site

      # enablement: true switches Pages on via the API, so there is no manual repo
      # setting to remember. UNVERIFIED whether the default GITHUB_TOKEN carries enough
      # scope for that; if this step fails, enable it once by hand and the input becomes
      # a no-op:
      #   gh api -X POST repos/Saeverix/rpm-builds/pages -f build_type=workflow
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

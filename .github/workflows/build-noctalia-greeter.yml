# Builds noctalia-greeter and attaches the RPM to a GitHub Release, which
# publish-pages.yml then turns into a dnf repo.
name: build noctalia-greeter

on:
  push:
    tags:
      # Prefix must not overlap with build-noctalia.yml's 'noctalia-[0-9]*' --
      # that workflow's filter was narrowed specifically so it does not also
      # match tags for this package.
      - 'noctalia-greeter-*'
  pull_request:
    paths:
      - 'packages/noctalia-greeter/**'
      - '.github/workflows/build-noctalia-greeter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kill switch: set to anything but 'true' to stop this workflow after the dry
  # run without touching the trigger or job structure below.
  #
  # The sign step needs the RPM_GPG_KEY repository secret; without it the step
  # fails rather than silently shipping unsigned RPMs.
  RPM_BUILD_ENABLED: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: prepare build environment
        run: |
          set -eux
          # Unlike noctalia, this package's meson.build has no vcs_tag() call,
          # so there is no hazard from git being on PATH -- it is simply left
          # out because nothing here needs it.
          dnf -y install rpm-build rpmdevtools dnf5-plugins
          mkdir -p _build/SOURCES _build/BUILD _build/BUILDROOT _build/RPMS _build/SRPMS output

          # THE RULE, the same in all workflows here: root does dnf, everything
          # else runs as `builder`. rpmbuild as root is the anomaly, not the
          # exception -- mock builds every Fedora package as "mockbuild", and
          # root hides packaging bugs: an %install that writes outside
          # %{buildroot} succeeds silently as root and fails loudly as builder.
          #
          # This is the only chown in the workflow. Because spectool drops
          # privileges too, root never writes into _build after this line, so
          # there is nothing to keep re-chowning.
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder _build

          # Prove `builder` can actually reach the workspace before the build
          # depends on it. The runner's /__w path is not something this repo
          # controls, and a traversal failure here would otherwise surface as a
          # confusing rpmbuild error much later.
          runuser -u builder -- ls -ld "$PWD/_build"

      # Not a stub: rpmspec expands %{?dist} on the running distro, so this
      # asserts the container is the distro we think it is, that the spec still
      # parses there, and that the filenames the release job will upload are
      # the expected ones.
      - name: dry run
        run: |
          set -eu
          spec=packages/noctalia-greeter/noctalia-greeter.spec
          echo "  srpm:    $(rpmspec -q --srpm --qf '%{name}-%{version}-%{release}' "$spec")"
          echo '  would publish:'
          rpmspec -q --qf '    %{name}-%{version}-%{release}.%{arch}.rpm\n' "$spec" \
            | grep -vE -- '-debug(info|source)-'

      # GitHub Actions runs each `run:` in a SEPARATE shell, so the whole build
      # sequence has to be one `run: |` block. Every path stays absolute and
      # there is no cd.
      - name: build
        if: env.RPM_BUILD_ENABLED == 'true'
        run: |
          set -eux
          # The alternation below is deliberate: `dnf` needs root, spectool and
          # rpmbuild do not and must not have it. runuser takes an argv list
          # rather than a command string, so there is no nested quoting to get
          # wrong.
          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/noctalia-greeter/noctalia-greeter.spec
          dnf -y builddep packages/noctalia-greeter/noctalia-greeter.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/noctalia-greeter/noctalia-greeter.spec

          # The whole claim of this workflow, in one command. If a future edit
          # reintroduces a root write into the build tree, this fails here
          # rather than silently producing a package built with the wrong
          # privileges.
          if [ -n "$(find _build ! -user builder -print -quit)" ]; then
            echo 'ERROR: root-owned files in _build; something ran privileged' >&2
            find _build ! -user builder -ls | head >&2
            exit 1
          fi

          cp _build/RPMS/*/*.rpm _build/SRPMS/*.rpm output/
          sha256sum output/*.rpm

      # Signed here rather than at publish time so the Release asset is byte
      # for byte what dnf serves -- otherwise anyone grabbing an RPM off the
      # Releases page gets an unsigned file that gpgcheck=1 refuses.
      #
      # No `set -x` in this step: it would echo the key material into the log.
      - name: sign
        if: env.RPM_BUILD_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
        run: |
          set -eu
          dnf -y install rpm-sign gnupg2

          # rpmsign shells out to gpg, so the key has to be in a keyring rather
          # than just on disk. The key carries no passphrase, which is what
          # lets gpg run with rpm's default --pinentry-mode cancel.
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')

          # An empty FPR here means the secret held a public key, or no key at
          # all -- rpmsign would fail either way, but with an error that says
          # nothing about the cause.
          [ -n "$FPR" ] || { echo 'RPM_GPG_KEY imported no secret key' >&2; exit 1; }

          # Binary RPMs only. debuginfo, debugsource and the SRPM are all
          # rebuildable from the tagged spec, so they stay out of the repo.
          mkdir -p publish
          cp $(ls output/*.rpm | grep -vE -- '-debug(info|source)-|\.src\.rpm$') publish/
          rpmsign --define "_gpg_name $FPR" --addsign publish/*.rpm

          # Verify against the key that just made the signatures. Do NOT test
          # this by checking that a signature tag is populated: %{SIGPGP} is
          # the legacy signature tag and reads (none) on rpm 4.20 even for a
          # correctly signed package, so that check rejects every build.
          # Importing the public key and letting rpm verify is the honest
          # test, and -v records the key ID in the log.
          gpg --export --armor "$FPR" > /tmp/rpm-pubkey.asc
          rpm --import /tmp/rpm-pubkey.asc
          if ! rpm -Kv publish/*.rpm; then echo 'signature verification failed'; exit 1; fi

      - name: upload build output
        if: env.RPM_BUILD_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-fedora-44
          path: output/*.rpm
          if-no-files-found: error

      - name: upload publishable rpms
        if: env.RPM_BUILD_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: publish-fedora-44
          path: publish/*.rpm
          if-no-files-found: error

  # A separate job on the host runner rather than a step in the container:
  # `gh` is preinstalled there and is not packaged for every distro we build
  # in. See build-fish.yml for the other reason -- a matrix would otherwise
  # have each axis racing to create the same release.
  #
  # `env` is not available in a job-level `if:`, only in a step-level one, so
  # if RPM_BUILD_ENABLED is ever flipped off this job still runs on a tag but
  # skips every step. That is expected; it creates nothing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download publishable rpms
        if: env.RPM_BUILD_ENABLED == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          merge-multiple: true
          path: publish

      - name: create release
        if: env.RPM_BUILD_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout, so there is no git remote for gh
          # to infer the repository from and it exits with "not a git
          # repository". GH_REPO names the target directly. Adding a checkout
          # would work too, but cloning the repo just to tell gh its own name
          # is the wrong trade.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Built from \`$GITHUB_REF_NAME\`." publish/*.rpm \
            || gh release upload "$GITHUB_REF_NAME" --clobber publish/*.rpm

  # Regenerating the dnf repo is a direct call rather than a `release:
  # published` trigger, because the release above was created with the
  # default GITHUB_TOKEN and those events deliberately do not start other
  # workflows. See publish-pages.yml.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-pages.yml
    permissions:
      contents: read     # gh release download
      pages: write
      id-token: write    # deploy-pages authenticates over OIDC
    # Passes RPM_GPG_KEY through; the metadata is signed with the same key as
    # the RPMs.
    secrets: inherit

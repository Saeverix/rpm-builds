# Builds Hyprland and the nine packages it needs, in dependency order.
#
# Translated from .woodpecker/hyprland.yaml. Both are switched on, so a `hyprland-*`
# tag builds twice: Woodpecker signs and rsyncs to the K3s repo, this one signs and
# attaches all ten packages' RPMs to a GitHub Release which publish-pages.yml turns
# into a dnf repo.
#
# Fedora 44 has six of those libraries already, but every one of them is too old
# for this Hyprland (hyprutils 0.7.1 against a required 0.14.0, for instance), and
# aquamarine, hyprwire and glaze are missing entirely. So the whole hypr* stack is
# built here, pinned to the versions upstream's own flake.lock records for
# Hyprland 0.56.1 -- a mix of ours and Fedora's would be a combination nobody
# upstream has ever built.
#
# Our hyprutils, hyprlang, hyprgraphics, hyprcursor, hyprwayland-scanner-devel and
# hyprland-protocols-devel deliberately carry Fedora's package names and file
# paths, so they upgrade Fedora's rather than colliding with them.
#
# They share this workflow rather than getting one each because Hyprland is the
# only consumer; inside one workflow the handoff is just a `dnf install` of the
# devel RPMs built a moment ago. Give one its own workflow the day something else
# needs it.
#
# Woodpecker's own reason for keeping them in one workflow -- depends_on orders
# workflows but shares no files between them -- does not apply to GitHub Actions,
# which can pass files between jobs as artifacts. The conclusion survives anyway:
# ten jobs would mean re-running `dnf builddep` and shuttling RPMs through the
# artifact store at every hop, for a chain that is genuinely sequential.
name: build hyprland

on:
  push:
    tags:
      # Ten packages, one tag. The tag names the deliverable and the nine libraries
      # are an implementation detail of building it, so there is deliberately no
      # `hyprutils-*` or `aquamarine-*` prefix. Such a prefix would not build that
      # library on its own -- the build step below has no idea which tag fired and
      # always builds all ten -- so it would only be a second name for this same
      # pipeline, which reads like a feature and is not one.
      #
      # That means bumping a library also means bumping hyprland's Release, so the
      # rebuilt Hyprland publishes under an NVR clients will actually pick up. See
      # the hyprland section in README.md.
      - 'hyprland-*'
      # Stage-1 only. Woodpecker matches refs/tags/hyprland-* and its publish step
      # is NOT disabled, so a test tag using the real prefix would sign a build and
      # rsync it into the live K3s repo. `citest-` matches nothing in Woodpecker's
      # ref.include. Remove once .woodpecker/ is gone.
      - 'citest-hyprland-*'
  # A path filter is well defined for a pull request -- it diffs against the base
  # branch -- unlike for a tag, which is why the tag filter above matches on name.
  # All ten package directories are listed: any of them changing means this stack
  # needs rebuilding.
  pull_request:
    paths:
      - 'packages/hyprwayland-scanner/**'
      - 'packages/hyprland-protocols/**'
      - 'packages/glaze/**'
      - 'packages/hyprutils/**'
      - 'packages/hyprlang/**'
      - 'packages/hyprwire/**'
      - 'packages/hyprgraphics/**'
      - 'packages/hyprcursor/**'
      - 'packages/aquamarine/**'
      - 'packages/hyprland/**'
      - '.github/workflows/build-hyprland.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Enabled: this workflow builds, signs and publishes for real. Last of the four to
  # be turned on, and the only one never rehearsed locally -- ten packages is a slow
  # thing to run twice, and it introduces no mechanism the other three have not
  # already proven. Its first real run IS the test.
  #
  # What could still surprise: none of these ten has a %check, so the exposure is a
  # %build or %install that quietly relied on root -- writing outside %{buildroot} or
  # reaching into /usr. That fails loudly as `builder` with a permission error naming
  # the path, which is the point of building unprivileged.
  #
  # The sign step needs the RPM_GPG_KEY repository secret; without it the step fails
  # rather than silently shipping unsigned RPMs.
  RPM_BUILD_ENABLED: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    # Ten packages including a C++26 compile of Hyprland itself. GitHub's own hard
    # limit is 6h per job, so this sits just under it: there is no cheaper failure
    # than hitting the ceiling, and public repos do not meter minutes. Lower it once
    # you have seen a real wall clock.
    timeout-minutes: 350
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      # The Fedora image ships no git binary, so checkout falls back to fetching a
      # tarball through the REST API and leaves NO .git directory in the workspace.
      - uses: actions/checkout@v7

      - name: prepare build environment
        run: |
          set -eux
          # dnf5-plugins provides `dnf builddep`, rpmdevtools provides `spectool`.
          # Deliberately no git: nothing in this chain needs it, and Hyprland's
          # release tarball already carries a fully substituted src/version.h.in, so
          # a git in PATH could only make the compiled-in version worse.
          dnf -y install rpm-build rpmdevtools dnf5-plugins
          mkdir -p _build/SOURCES _build/BUILD _build/BUILDROOT _build/RPMS _build/SRPMS output

          # Assert the invariant rather than trusting the base image to keep it.
          if command -v git >/dev/null 2>&1; then
            echo 'ERROR: git is on PATH; this stack must build without it' >&2
            exit 1
          fi

          # THE RULE, the same in all four workflows: root does dnf, everything else
          # runs as `builder`. rpmbuild as root is the anomaly, not the exception --
          # mock builds every Fedora package as "mockbuild" whether or not its %check
          # cares. None of these ten packages has a %check at all, so the payoff here
          # is the other one: root hides packaging bugs. An %install that writes
          # outside %{buildroot}, or a build that reaches into /usr, succeeds silently
          # as root and fails loudly as builder.
          #
          # This is the only chown in the workflow. Because spectool drops privileges
          # too, root never writes into _build after this line, so there is nothing to
          # keep re-chowning between the ten links of the chain.
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder _build

          # Prove `builder` can traverse to the workspace before the build depends on
          # it. The runner's /__w path is not something this repo controls, and a
          # traversal failure would otherwise surface as a confusing rpmbuild error
          # ten packages deep.
          runuser -u builder -- ls -ld "$PWD/_build"

      # Not a stub: rpmspec expands %{?dist} on the running distro, so this asserts
      # the container is the distro we think it is, that all ten specs still parse
      # there, and that the filenames the release job will upload are the expected
      # ones.
      - name: dry run
        run: |
          set -eu
          # Listed rather than globbed, and in the same order as the build chain
          # below, so the two stay readable against each other. A glob over
          # packages/*/ would silently pull in a package added for another workflow.
          for pkg in hyprwayland-scanner hyprland-protocols glaze hyprutils \
                     hyprlang hyprwire hyprgraphics hyprcursor aquamarine hyprland; do
            spec="packages/$pkg/$pkg.spec"
            echo "--- $spec"
            echo "  srpm:    $(rpmspec -q --srpm --qf '%{name}-%{version}-%{release}' "$spec")"
            echo '  would publish:'
            rpmspec -q --qf '    %{name}-%{version}-%{release}.%{arch}.rpm\n' "$spec" \
              | grep -vE -- '-debug(info|source)-'
          done

      # ----------------------------------------------------------------------
      # Everything below is stage 2. Verbatim from .woodpecker/hyprland.yaml.
      #
      # Woodpecker joins a step's commands into ONE shell, so state leaks between
      # lines by design -- here, each stage's `dnf install` must be visible to the
      # rpmbuild after it. GitHub Actions runs each `run:` in a SEPARATE shell, so
      # the whole chain is one `run: |` block. Do not split it into per-package
      # steps; the fourth one would fail to find what the third installed.
      # ----------------------------------------------------------------------
      - name: build
        if: env.RPM_BUILD_ENABLED == 'true'
        run: |
          set -eux
          # Dependency order, so each package builds against what the lines above it
          # produced. hyprwayland-scanner, hyprland-protocols and glaze first --
          # they need nothing from the rest of the stack; then hyprutils, which
          # everything else is built on; then Hyprland last.
          #
          # The `dnf install` after each rpmbuild takes the whole accumulated set
          # each time, which is harmless -- dnf treats already-installed packages as
          # satisfied -- and shorter than naming individual RPMs. The glob covers
          # _build/RPMS/noarch as well as x86_64, because hyprland-protocols-devel
          # and glaze-devel are noarch. Debug packages are skipped: nothing needs
          # them and they drag in extra deps.
          #
          # The alternation repeated ten times below is deliberate, not an oversight:
          # `dnf` needs root, spectool and rpmbuild do not and must not have it.
          # runuser takes an argv list rather than a command string, so there is no
          # nested quoting to get wrong -- $PWD still expands in this (root) shell
          # before exec, so the paths stay absolute exactly as they were under
          # Woodpecker.
          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprwayland-scanner/hyprwayland-scanner.spec
          dnf -y builddep packages/hyprwayland-scanner/hyprwayland-scanner.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprwayland-scanner/hyprwayland-scanner.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprland-protocols/hyprland-protocols.spec
          dnf -y builddep packages/hyprland-protocols/hyprland-protocols.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprland-protocols/hyprland-protocols.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/glaze/glaze.spec
          dnf -y builddep packages/glaze/glaze.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/glaze/glaze.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprutils/hyprutils.spec
          dnf -y builddep packages/hyprutils/hyprutils.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprutils/hyprutils.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprlang/hyprlang.spec
          dnf -y builddep packages/hyprlang/hyprlang.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprlang/hyprlang.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprwire/hyprwire.spec
          dnf -y builddep packages/hyprwire/hyprwire.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprwire/hyprwire.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprgraphics/hyprgraphics.spec
          dnf -y builddep packages/hyprgraphics/hyprgraphics.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprgraphics/hyprgraphics.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprcursor/hyprcursor.spec
          dnf -y builddep packages/hyprcursor/hyprcursor.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprcursor/hyprcursor.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/aquamarine/aquamarine.spec
          dnf -y builddep packages/aquamarine/aquamarine.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/aquamarine/aquamarine.spec
          dnf -y install $(ls _build/RPMS/*/*.rpm | grep -v -- -debug)

          runuser -u builder -- spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/hyprland/hyprland.spec
          dnf -y builddep packages/hyprland/hyprland.spec
          runuser -u builder -- rpmbuild --define "_topdir $PWD/_build" -ba packages/hyprland/hyprland.spec

          # The whole claim of this workflow, in one command. Ten packages and twenty
          # alternating privileged/unprivileged commands is exactly where a root write
          # could slip back in unnoticed; this fails the build instead.
          if [ -n "$(find _build ! -user builder -print -quit)" ]; then
            echo 'ERROR: root-owned files in _build; something ran privileged' >&2
            find _build ! -user builder -ls | head >&2
            exit 1
          fi

          cp _build/RPMS/*/*.rpm _build/SRPMS/*.rpm output/
          sha256sum output/*.rpm

      # Signed here rather than at publish time so the Release asset is byte for
      # byte what dnf serves -- otherwise anyone grabbing an RPM off the Releases
      # page gets an unsigned file that gpgcheck=1 refuses.
      #
      # No `set -x` in this step: it would echo the key material into the log.
      - name: sign
        if: env.RPM_BUILD_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
        run: |
          set -eu
          dnf -y install rpm-sign gnupg2

          # rpmsign shells out to gpg, so the key has to be in a keyring rather than
          # just on disk. The key carries no passphrase, which is what lets gpg run
          # with rpm's default --pinentry-mode cancel.
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')

          # Binary RPMs only. debuginfo, debugsource and the SRPM are all
          # rebuildable from the tagged spec, so they stay out of the repo.
          mkdir -p publish
          cp $(ls output/*.rpm | grep -vE -- '-debug(info|source)-|\.src\.rpm$') publish/
          rpmsign --define "_gpg_name $FPR" --addsign publish/*.rpm

          # Verify against the key that just made the signatures. Do NOT test this
          # by checking that a signature tag is populated: %{SIGPGP} is the legacy
          # tag and reads (none) on rpm 4.20 even for a correctly signed package, so
          # that check rejects every build. Importing the public key and letting rpm
          # verify is the honest test, and -v records the key ID in the log.
          gpg --export --armor "$FPR" > /tmp/rpm-pubkey.asc
          rpm --import /tmp/rpm-pubkey.asc
          if ! rpm -Kv publish/*.rpm; then echo 'signature verification failed'; exit 1; fi

      - name: upload build output
        if: env.RPM_BUILD_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-fedora-44
          path: output/*.rpm
          if-no-files-found: error

      - name: upload publishable rpms
        if: env.RPM_BUILD_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: publish-fedora-44
          path: publish/*.rpm
          if-no-files-found: error

  # A separate job on the host runner rather than a step in the container: `gh` is
  # preinstalled there and is not packaged for every distro we build in. See
  # build-fish.yml for the other reason -- a matrix would otherwise have each axis
  # racing to create the same release.
  #
  # `env` is not available in a job-level `if:`, only in a step-level one, so during
  # stage 1 this job runs on a tag and skips every step. That is expected; it
  # creates nothing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download publishable rpms
        if: env.RPM_BUILD_ENABLED == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          merge-multiple: true
          path: publish

      - name: create release
        if: env.RPM_BUILD_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout, so there is no git remote for gh to
          # infer the repository from and it exits with "not a git repository".
          # GH_REPO names the target directly. Adding a checkout would work too, but
          # cloning the repo just to tell gh its own name is the wrong trade.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Built from \`$GITHUB_REF_NAME\`." publish/*.rpm \
            || gh release upload "$GITHUB_REF_NAME" --clobber publish/*.rpm

  # Regenerating the dnf repo is a direct call rather than a `release: published`
  # trigger, because the release above was created with the default GITHUB_TOKEN and
  # those events deliberately do not start other workflows. See publish-pages.yml.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-pages.yml
    permissions:
      contents: read     # gh release download
      pages: write
      id-token: write    # deploy-pages authenticates over OIDC
    # Passes RPM_GPG_KEY through; the metadata is signed with the same key as the RPMs.
    secrets: inherit

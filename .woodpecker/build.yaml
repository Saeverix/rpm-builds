when:
  - event: [push, pull_request, manual]

steps:
  - name: build
    image: registry.fedoraproject.org/fedora:44
    commands:
      # dnf5-plugins provides `dnf builddep`, rpmdevtools provides `spectool`.
      # Note the absence of git: mango's meson.build changes the version string
      # it compiles in when git is on PATH, and %{_builddir} is not a checkout.
      # Woodpecker's clone runs in its own container, so nothing here needs it.
      - dnf -y install rpm-build rpmdevtools dnf5-plugins createrepo_c
      - ./scripts/build.sh

# Woodpecker has no built-in artifact store: the RPMs land in ./output in the

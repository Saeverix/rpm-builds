# Tags are matched on their name rather than on changed paths. Path filters are
# defined against a diff, and what a tag event diffs against is not something to
# rely on; a tag name is unambiguous. So `fish-4.8.1-1` publishes fish and
# touches nothing else.
when:
  - event: [push, pull_request, manual]
    path:
      include:
        - packages/fish/**
        - .woodpecker/fish.yaml
  - event: tag
    ref:
      include:
        - refs/tags/fish-*

steps:
  - name: build
    image: registry.fedoraproject.org/fedora:44
    commands:
      # git-core is required here, unlike in mango.yaml where its absence is
      # deliberate: `cargo vendor` below clones fish's four git dependencies.
      # Do not "harmonise" the two workflows on this point.
      - dnf -y install rpm-build rpmdevtools dnf5-plugins cargo git-core
      - mkdir -p _build/SOURCES _build/BUILD _build/BUILDROOT _build/RPMS _build/SRPMS output

      # Fetches Source0/1/2, which have URLs. Source3 (the vendor tarball) has a
      # bare filename, so spectool skips it and we build it below.
      - spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/fish/fish.spec

      # Vendor the cargo dependencies so %build can run with CARGO_NET_OFFLINE.
      # Woodpecker runs every command in this step in ONE shell, so these
      # variables carry across lines -- and a stray `cd` would too, which is why
      # every path below is absolute.
      - SOURCES=$PWD/_build/SOURCES
      - VER=$(rpmspec -q --qf '%{version}\n' --srpm packages/fish/fish.spec)
      - SRC=$SOURCES/fish-$VER
      - VENDOR=$SOURCES/vendor-tmp
      - rm -rf "$SRC" "$VENDOR"
      - tar -C "$SOURCES" -xf "$SOURCES/fish-$VER.tar.xz"
      - mkdir -p "$VENDOR/.cargo"
      # cargo vendor gets NO output path and runs from $VENDOR, because it writes
      # whatever path it is given into config.toml verbatim, and this tarball is
      # unpacked at the root of the source tree where the directory must be
      # exactly "vendor". Give it a path and the build dies with "failed to read
      # root of directory source". The cat preserves upstream's [alias] xtask
      # stanza, which cargo's [source] replacement would otherwise clobber.
      # The subshell keeps that cd from leaking into any later command.
      - (cd "$VENDOR" && { cat "$SRC/.cargo/config.toml"; cargo vendor --manifest-path "$SRC/Cargo.toml"; } > .cargo/config.toml)
      - tar -C "$VENDOR" -cJf "$SOURCES/fish-$VER-vendor.tar.xz" vendor .cargo
      - rm -rf "$SRC" "$VENDOR"

      - dnf -y builddep packages/fish/fish.spec

      # rpmbuild must NOT run as root. fish's %check includes tests that assert
      # on unreadable files and directories (init-unreadable-cwd,
      # init-unreadable-config-paths, cd, path, fish_config, indent), and root
      # bypasses those permissions, so they fail: 197/203 as root, 203/203
      # unprivileged. Fedora never sees this because mock builds as "mockbuild".
      # dnf above still needs root, so only rpmbuild is dropped.
      - id builder >/dev/null 2>&1 || useradd -m builder
      - chown -R builder:builder _build
      - su builder -c "rpmbuild --define '_topdir $PWD/_build' -ba $PWD/packages/fish/fish.spec"

      # output/ is the handoff point for the publish step below. On anything but a
      # tag the pipeline stops here and these RPMs die with the workspace volume
      # -- Woodpecker has no artifact store.
      - cp _build/RPMS/*/*.rpm _build/SRPMS/*.rpm output/
      - sha256sum output/*.rpm

  # Signs the binary RPMs and pushes them into the dnf repo on the K3s cluster.
  # Duplicated verbatim in mango.yaml rather than factored into a script, so each
  # workflow stays readable end to end on its own.
  #
  # The GPG private key never leaves this step. Metadata is generated in the
  # cluster, so repomd.xml cannot be signed at the moment it is written; instead
  # createrepo_c is triggered over ssh, the finished repomd.xml is pulled back
  # here, signed where the key already is, and only the detached signature goes
  # up. The cluster therefore holds no signing material at all.
  - name: publish
    image: registry.fedoraproject.org/fedora:44
    when:
      - event: tag
    environment:
      REPO_HOST:
        from_secret: rpm_repo_host
      SSH_KEY:
        from_secret: rpm_ssh_key
      KNOWN_HOSTS:
        from_secret: rpm_ssh_known_hosts
      GPG_KEY:
        from_secret: rpm_gpg_key
    commands:
      - dnf -y install rpm-sign gnupg2 openssh-clients rsync

      # rpmsign shells out to gpg, so the key has to be in a keyring rather than
      # just on disk. The key carries no passphrase, which is what lets gpg run
      # with rpm's default --pinentry-mode cancel.
      - printf '%s\n' "$GPG_KEY" | gpg --batch --import
      # -F':' is quoted because a bare "-F: " is a colon-space, which YAML reads
      # as a key separator and the file then fails to parse.
      - FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')

      # Binary RPMs only. debuginfo, debugsource and the SRPM are all rebuildable
      # from the tagged spec, so they stay out of the repo.
      - mkdir -p publish
      - cp $(ls output/*.rpm | grep -vE -- '-debug(info|source)-|\.src\.rpm$') publish/
      - rpmsign --define "_gpg_name $FPR" --addsign publish/*.rpm

      # Verify against the key that just made the signatures. Do NOT test this by
      # checking that a signature tag is populated: %{SIGPGP} is the legacy tag
      # and reads (none) on rpm 4.20 even for a correctly signed package, so that
      # check rejects every build. Importing the public key and letting rpm verify
      # is the honest test, and -v records the key ID in the log.
      - gpg --export --armor "$FPR" > /tmp/rpm-pubkey.asc
      - rpm --import /tmp/rpm-pubkey.asc
      - if ! rpm -Kv publish/*.rpm; then echo 'signature verification failed'; exit 1; fi

      # Woodpecker runs these commands in one shell, so RSH and REPO carry across
      # the lines below. Every path is absolute and there is no cd.
      - install -d -m 700 $HOME/.ssh
      - printf '%s\n' "$SSH_KEY" > $HOME/.ssh/id_ed25519
      - chmod 600 $HOME/.ssh/id_ed25519
      - printf '%s\n' "$KNOWN_HOSTS" > $HOME/.ssh/known_hosts
      - RSH="ssh -p 2222 -i $HOME/.ssh/id_ed25519"
      - REPO=/srv/repo/fedora/44/x86_64

      - rsync -av -e "$RSH" publish/ rpm-publish@$REPO_HOST:$REPO/

      # Keep the newest 3 of each package, then refresh the metadata in place.
      # repomanage reads RPM headers, so this is version-aware rather than
      # lexical -- fish-4.10.0 correctly outranks fish-4.9.0.
      - $RSH rpm-publish@$REPO_HOST "dnf repomanage --old --keep 3 $REPO | xargs -r rm -f && createrepo_c --update $REPO"

      - $RSH rpm-publish@$REPO_HOST "cat $REPO/repodata/repomd.xml" > repomd.xml
      - gpg --batch --yes --detach-sign --armor -u "$FPR" -o repomd.xml.asc repomd.xml
      - rsync -av -e "$RSH" repomd.xml.asc rpm-publish@$REPO_HOST:$REPO/repodata/

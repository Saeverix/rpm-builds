# A tag is the only thing that runs this workflow. Ordinary commits build
# nothing, so a spec is checked with a local rpmbuild before it is tagged.
#
# Tags are matched on their name rather than on changed paths. Path filters are
# defined against a diff, and what a tag event diffs against is not something to
# rely on; a tag name is unambiguous. So `fish-4.8.1-1` publishes fish and
# touches nothing else.
#
# One tag now fans out to two distros. Woodpecker runs an axis per matrix entry on
# separate agents, so `fish-4.8.1-1` produces fish-4.8.1-1.fc44 AND
# fish-4.8.1-1.el10 and publishes each into its own repo tree. An RPM cannot be
# shared between them: EL10 is glibc 2.39 against Fedora 44's 2.43, the sonames
# differ, and %{?dist} differs. One spec still covers both -- fish needs no
# conditionals.
#
# The axes publish independently, which is the tradeoff to know about: if EL10
# fails after Fedora has already pushed, the release is half-published. Recover by
# fixing the cause and tagging again with Release bumped, exactly as for a
# single-distro failure.
matrix:
  include:
    - DISTRO: fedora
      RELEASEVER: "44"
      IMAGE: registry.fedoraproject.org/fedora:44
    # quay.io/almalinux/almalinux:10 does NOT resolve -- the org path is
    # almalinuxorg. Getting this wrong fails at image pull with a confusing
    # manifest error.
    - DISTRO: almalinux
      RELEASEVER: "10"
      IMAGE: quay.io/almalinuxorg/almalinux:10

when:
  - event: tag
    ref:
      include:
        - refs/tags/fish-*

steps:
  - name: build
    image: ${IMAGE}
    commands:
      # git-core is required here, unlike in mangowm.yaml where its absence is
      # deliberate: `cargo vendor` below clones fish's four git dependencies.
      # Do not "harmonise" the two workflows on this point.
      - dnf -y install rpm-build rpmdevtools cargo git-core

      # The builddep plugin is packaged differently per distro, so it is installed
      # per axis rather than through one clever portable name. Fedora 44 is dnf5
      # and wants dnf5-plugins; EL10 is still dnf4 (4.20.0), where dnf5-plugins
      # does not exist at all.
      - if [ "$DISTRO" = fedora ]; then dnf -y install dnf5-plugins; fi
      # CRB is not optional -- several of fish's build dependencies live there and
      # builddep cannot resolve without it. EPEL supplies the rest. AlmaLinux has
      # no `devel` repo; that is CentOS Stream, so do not reach for it here.
      - if [ "$DISTRO" = almalinux ]; then dnf -y install epel-release dnf-plugins-core && dnf config-manager --set-enabled crb; fi
      - mkdir -p _build/SOURCES _build/BUILD _build/BUILDROOT _build/RPMS _build/SRPMS output

      # Fetches Source0/1/2, which have URLs. Source3 (the vendor tarball) has a
      # bare filename, so spectool skips it and we build it below.
      - spectool --define "_topdir $PWD/_build" --get-files --sourcedir packages/fish/fish.spec

      # Vendor the cargo dependencies so %build can run with CARGO_NET_OFFLINE.
      # Woodpecker runs every command in this step in ONE shell, so these
      # variables carry across lines -- and a stray `cd` would too, which is why
      # every path below is absolute.
      - SOURCES=$PWD/_build/SOURCES
      - VER=$(rpmspec -q --qf '%{version}\n' --srpm packages/fish/fish.spec)
      - SRC=$SOURCES/fish-$VER
      - VENDOR=$SOURCES/vendor-tmp
      - rm -rf "$SRC" "$VENDOR"
      - tar -C "$SOURCES" -xf "$SOURCES/fish-$VER.tar.xz"
      - mkdir -p "$VENDOR/.cargo"
      # cargo vendor gets NO output path and runs from $VENDOR, because it writes
      # whatever path it is given into config.toml verbatim, and this tarball is
      # unpacked at the root of the source tree where the directory must be
      # exactly "vendor". Give it a path and the build dies with "failed to read
      # root of directory source". The cat preserves upstream's [alias] xtask
      # stanza, which cargo's [source] replacement would otherwise clobber.
      # The subshell keeps that cd from leaking into any later command.
      - (cd "$VENDOR" && { cat "$SRC/.cargo/config.toml"; cargo vendor --manifest-path "$SRC/Cargo.toml"; } > .cargo/config.toml)
      - tar -C "$VENDOR" -cJf "$SOURCES/fish-$VER-vendor.tar.xz" vendor .cargo
      - rm -rf "$SRC" "$VENDOR"

      - dnf -y builddep packages/fish/fish.spec

      # rpmbuild must NOT run as root. fish's %check includes tests that assert
      # on unreadable files and directories (init-unreadable-cwd,
      # init-unreadable-config-paths, cd, path, fish_config, indent), and root
      # bypasses those permissions, so they fail: 197/203 as root, 203/203
      # unprivileged. Fedora never sees this because mock builds as "mockbuild".
      # dnf above still needs root, so only rpmbuild is dropped.
      - id builder >/dev/null 2>&1 || useradd -m builder
      - chown -R builder:builder _build
      - su builder -c "rpmbuild --define '_topdir $PWD/_build' -ba $PWD/packages/fish/fish.spec"

      # output/ is the handoff point for the publish step below; Woodpecker has no
      # artifact store, so these RPMs live only as long as the workspace volume.
      - cp _build/RPMS/*/*.rpm _build/SRPMS/*.rpm output/
      - sha256sum output/*.rpm

  # Signs the binary RPMs and pushes them into the dnf repo on the K3s cluster.
  # Duplicated in mangowm.yaml and noctalia.yaml rather than factored into a script,
  # so each workflow stays readable end to end on its own.
  #
  # This copy is no longer byte-identical to those two, because it is the only
  # multi-distro workflow: `image` and `REPO` are parameterised on the matrix axis,
  # and it creates the repo directory before the first rsync. Everything else is
  # unchanged, and any fix to the signing or metadata logic still belongs in all
  # three. If a second package ever targets more than one distro, that is the point
  # to harmonise the three steps again rather than let a third variant appear.
  #
  # The GPG private key never leaves this step. Metadata is generated in the
  # cluster, so repomd.xml cannot be signed at the moment it is written; instead
  # createrepo_c is triggered over ssh, the finished repomd.xml is pulled back
  # here, signed where the key already is, and only the detached signature goes
  # up. The cluster therefore holds no signing material at all.
  - name: publish
    image: ${IMAGE}
    # Redundant against the workflow-level filter today, since only tags get here
    # at all. Kept because this step signs packages and writes to the live repo:
    # if another trigger is ever added above, publishing should not follow it by
    # default.
    when:
      - event: tag
    environment:
      REPO_HOST:
        from_secret: rpm_repo_host
      SSH_KEY:
        from_secret: rpm_ssh_key
      KNOWN_HOSTS:
        from_secret: rpm_ssh_known_hosts
      GPG_KEY:
        from_secret: rpm_gpg_key
    commands:
      - dnf -y install rpm-sign gnupg2 openssh-clients rsync

      # rpmsign shells out to gpg, so the key has to be in a keyring rather than
      # just on disk. The key carries no passphrase, which is what lets gpg run
      # with rpm's default --pinentry-mode cancel.
      - printf '%s\n' "$GPG_KEY" | gpg --batch --import
      # -F':' is quoted because a bare "-F: " is a colon-space, which YAML reads
      # as a key separator and the file then fails to parse.
      - FPR=$(gpg --list-secret-keys --with-colons | awk -F':' '/^fpr/{print $10; exit}')

      # Binary RPMs only. debuginfo, debugsource and the SRPM are all rebuildable
      # from the tagged spec, so they stay out of the repo.
      - mkdir -p publish
      - cp $(ls output/*.rpm | grep -vE -- '-debug(info|source)-|\.src\.rpm$') publish/
      - rpmsign --define "_gpg_name $FPR" --addsign publish/*.rpm

      # Verify against the key that just made the signatures. Do NOT test this by
      # checking that a signature tag is populated: %{SIGPGP} is the legacy tag
      # and reads (none) on rpm 4.20 even for a correctly signed package, so that
      # check rejects every build. Importing the public key and letting rpm verify
      # is the honest test, and -v records the key ID in the log.
      - gpg --export --armor "$FPR" > /tmp/rpm-pubkey.asc
      - rpm --import /tmp/rpm-pubkey.asc
      - if ! rpm -Kv publish/*.rpm; then echo 'signature verification failed'; exit 1; fi

      # Woodpecker runs these commands in one shell, so RSH and REPO carry across
      # the lines below. Every path is absolute and there is no cd.
      - install -d -m 700 $HOME/.ssh
      - printf '%s\n' "$SSH_KEY" > $HOME/.ssh/id_ed25519
      - chmod 600 $HOME/.ssh/id_ed25519
      - printf '%s\n' "$KNOWN_HOSTS" > $HOME/.ssh/known_hosts
      - RSH="ssh -p 2222 -i $HOME/.ssh/id_ed25519"
      # One tree per distro, so the two axes never write to the same metadata.
      - REPO=/srv/repo/$DISTRO/$RELEASEVER/x86_64

      # rsync does not create intermediate directories, so a brand-new distro tree
      # has to exist before the first push or the transfer fails. -n for the same
      # reason as every other direct ssh below.
      - $RSH -n rpm-publish@$REPO_HOST "mkdir -p $REPO"

      - rsync -av -e "$RSH" publish/ rpm-publish@$REPO_HOST:$REPO/

      # Every direct ssh below MUST pass -n. Woodpecker feeds this script to the
      # shell on stdin, and ssh without -n reads stdin as well -- it swallows the
      # remaining lines as input for the remote command, so the step stops early
      # and still reports success. That is exactly how the signing below got
      # silently skipped once, leaving clients with no repomd.xml.asc. rsync is
      # unaffected because it drives its own ssh.
      #
      # Prune first, then rebuild the metadata. repomanage reads RPM headers, so
      # it is version-aware rather than lexical -- fish-4.10.0 correctly outranks
      # fish-4.9.0. On a repo with no metadata yet it prints a curl error and
      # lists nothing, which is harmless; there is nothing to prune on a first
      # publish.
      - $RSH -n rpm-publish@$REPO_HOST "dnf repomanage --old --keep 3 $REPO | xargs -r rm -f"
      - $RSH -n rpm-publish@$REPO_HOST "createrepo_c --update $REPO"

      - $RSH -n rpm-publish@$REPO_HOST "cat $REPO/repodata/repomd.xml" > repomd.xml
      - gpg --batch --yes --detach-sign --armor -u "$FPR" -o repomd.xml.asc repomd.xml
      - rsync -av -e "$RSH" repomd.xml.asc rpm-publish@$REPO_HOST:$REPO/repodata/

      # repo_gpgcheck=1 clients cannot load the repo at all without this file, and
      # a step that ends early looks green -- so assert it landed.
      - if ! $RSH -n rpm-publish@$REPO_HOST "test -s $REPO/repodata/repomd.xml.asc"; then echo 'repomd.xml.asc missing on the server'; exit 1; fi
